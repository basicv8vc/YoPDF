[package]
name = "yopdf-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "YoPDF native Windows reader UI on GPUI Kit"

[dependencies]
gpui-kit = "=0.9.1"
pdfcore = { path = "../pdfcore" }
image = { version = "0.25", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
